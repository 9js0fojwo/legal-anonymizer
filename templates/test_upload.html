<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Upload Test</title>
<style>
#drop { border:3px dashed #999; padding:60px; text-align:center; margin:20px; cursor:pointer; border-radius:12px; }
#drop:hover { border-color:#165DFF; background:#f0f5ff; }
#msg { margin:20px; padding:12px; font-family:monospace; font-size:14px; }
</style>
</head>
<body>
<h2>Upload Test</h2>
<p>Step 1: Click here to test JS → <button onclick="document.getElementById('msg').textContent='JS WORKS!';document.getElementById('msg').style.color='green';">Test JS</button></p>
<label id="drop" for="f">
  <div style="font-size:40px;">📁</div>
  <div style="font-size:16px;margin-top:10px;">Step 2: Click here or drop file</div>
  <div style="font-size:12px;color:#999;">This is a &lt;label&gt; pointing to hidden file input</div>
</label>
<input type="file" id="f" style="position:absolute;width:0;height:0;opacity:0;">
<div id="msg"></div>
<script>
var f=document.getElementById('f');
var m=document.getElementById('msg');
var d=document.getElementById('drop');

f.onchange = function(){
  if(!f.files.length) return;
  var file = f.files[0];
  m.textContent = 'Got file: ' + file.name + ' (' + file.size + ' bytes). Uploading...';
  m.style.color = 'blue';
  var fd = new FormData();
  fd.append('file', file);
  fetch('/api/upload', {method:'POST', body:fd})
    .then(r => r.json())
    .then(j => {
      if(j.error){ m.textContent='Server error: '+j.error; m.style.color='red'; }
      else { m.textContent='OK! session='+j.session_id+', file='+j.file_name; m.style.color='green'; }
    })
    .catch(function(e){ m.textContent='Network error: '+e.message; m.style.color='red'; });
};

d.ondragover = function(e){ e.preventDefault(); d.style.borderColor='#165DFF'; };
d.ondragleave = function(){ d.style.borderColor='#999'; };
d.ondrop = function(e){
  e.preventDefault();
  d.style.borderColor='#999';
  if(e.dataTransfer.files.length){
    f.files = e.dataTransfer.files;
    f.onchange();
  }
};
</script>
</body></html>
